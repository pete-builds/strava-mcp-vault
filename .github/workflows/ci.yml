name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # Installs the dev extra rather than pinning ruff a second time here, so
      # the linter version comes from pyproject.toml like every other pin.
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Must cover every version requires-python admits, or the floor is a
        # claim that nothing verifies.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # Installs from pyproject.toml, now the single dependency surface.
      - run: pip install -e ".[dev]"
      - run: pytest --cov --cov-report=term-missing --cov-report=xml -v
      - uses: actions/upload-artifact@v7
        if: always() && matrix.python-version == '3.13'
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  login-python39:
    # The README tells Docker users to run src/strava_mcp_vault/login.py
    # straight from a clone on whatever python3 they have, and macOS still
    # ships 3.9. GitHub's hosted Python builds cannot be relied on for an
    # end-of-life version, so this runs in the official python:3.9-slim image.
    # Standard library only: no pip install, which is the point.
    runs-on: ubuntu-latest
    container: python:3.9-slim
    steps:
      - uses: actions/checkout@v7
      - run: python -I tests/stdlib_smoke.py

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build distributions
        run: |
          pip install --upgrade build twine
          python -m build
          twine check --strict dist/*
      - name: Install the wheel into a clean venv and verify entry points
        # A repo can pass its tests from the source tree and still ship a wheel
        # that installs nothing importable. This catches that.
        run: |
          set -euo pipefail
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install --quiet dist/*.whl
          /tmp/verify/bin/python -c "import strava_mcp_vault; print(strava_mcp_vault.__version__)"
          test -x /tmp/verify/bin/strava-mcp-vault
          test -x /tmp/verify/bin/strava-mcp-vault-healthcheck
          test -x /tmp/verify/bin/strava-mcp-vault-login

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t strava-mcp-vault:test .
      - name: Healthcheck entry point exists in the image
        run: docker run --rm --entrypoint sh strava-mcp-vault:test -c 'command -v strava-mcp-vault-healthcheck'
