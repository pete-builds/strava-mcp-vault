x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  strava-mcp-vault:
    build: .
    container_name: strava-mcp-vault
    ports:
      # Default to localhost-only. Set MCP_BIND_HOST to a Tailscale or LAN
      # IP (or 0.0.0.0) when remote access is intended.
      - "${MCP_BIND_HOST:-127.0.0.1}:${STRAVA_MCP_PORT:-18201}:18201"
    env_file: .env
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - strava-data:/app/data
    logging: *default-logging
    healthcheck:
      test: ["CMD", "python", "-m", "strava_mcp_vault.healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - strava-net

volumes:
  strava-data:

networks:
  strava-net:
